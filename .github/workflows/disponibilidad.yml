# Sincroniza la disponibilidad desde Airbnb cada 3 horas (y a mano desde la pestaña Actions).
# Los enlaces iCal son secretos del repo: ICAL_CASA y ICAL_DEPA. Solo se publican fechas ocupadas.
name: Disponibilidad desde Airbnb
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer calendarios de Airbnb
        run: python3 scripts/ical_a_json.py
        env:
          ICAL_CASA: ${{ secrets.ICAL_CASA }}
          ICAL_DEPA: ${{ secrets.ICAL_DEPA }}
      - name: Publicar si cambió
        run: |
          git config user.name "kauri-calendario"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disponibilidad.json
          git diff --cached --quiet || (git commit -m "Disponibilidad actualizada desde Airbnb" && git push)
