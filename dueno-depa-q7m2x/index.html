<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Departamento Kauri · Llegadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#1B2433;--ink2:#5A6575;--line:#E4E0D8;--navy:#1F2F54;--sand:#C9B49C;--ok:#1C7A46;--okw:#E3F2E9;--warn:#9A6410;--warnw:#FBF0DA;--wa:#1FA855}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141B;--card:#18202B;--ink:#EEF1F4;--ink2:#A9B4C0;--line:#2A3442;--navy:#9FB4E8;--sand:#C9B49C;--ok:#5CC48A;--okw:#132A1D;--warn:#E9B957;--warnw:#2A2110;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
.top{background:#1F2F54;color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 54px}
.top .in{max-width:36rem;margin:0 auto}
.marca{font:700 1.5rem/1 "EB Garamond",Georgia,serif;letter-spacing:.06em}
.lugar{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-top:4px}
.top h1{font:800 1.6rem/1.15 "Source Sans 3",sans-serif;margin:18px 0 4px}
.top p{margin:0;opacity:.85}
main{max-width:36rem;margin:-36px auto 0;padding:0 16px 48px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;box-shadow:0 10px 30px rgba(20,30,50,.08);animation:sube .45s ease both}
@keyframes sube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.chip{justify-self:start;font:800 .72rem/1 "Source Sans 3";letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--okw);color:var(--ok)}
.chip.hoy{background:var(--warnw);color:var(--warn)}
.huesped{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 1.2rem/1 "Source Sans 3";flex:0 0 56px}
.huesped b{display:block;font-size:1.3rem;line-height:1.2}.huesped span{color:var(--ink2);font-size:.92rem}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:800;text-decoration:none;border:0;cursor:pointer;font-size:.98rem}
.btn.wa{background:var(--wa);color:#fff}.btn.tel{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--navy);color:#fff}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.fechas{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fechas div{background:var(--bg);border-radius:14px;padding:12px}.fechas small{display:block;color:var(--ink2);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}.fechas b{font-size:1.02rem;line-height:1.25}
.fechas i{font-style:normal;color:var(--sand);font-weight:800;text-align:center;font-size:.85rem}
.cobro{background:linear-gradient(135deg,var(--warnw),var(--card));border:2px solid var(--warn);border-radius:18px;padding:16px;text-align:center}
.cobro small{display:block;font-weight:800;color:var(--warn);text-transform:uppercase;letter-spacing:.1em;font-size:.75rem}
.cobro b{display:block;font-size:2.5rem;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0}
.cobro p{margin:0;font-size:.9rem;color:var(--ink2)}
.cobro.listo{border-color:var(--ok);background:var(--okw)}.cobro.listo small{color:var(--ok)}
dl{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0;font-variant-numeric:tabular-nums}dt{color:var(--ink2)}dd{margin:0;font-weight:700;text-align:right}
.alerta{background:var(--warnw);border-radius:14px;padding:12px 14px;font-size:.94rem}
ul.check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.check label{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px 14px;cursor:pointer}
ul.check input{width:22px;height:22px;margin-top:1px;flex:0 0 22px;accent-color:var(--ok)}
.vacio{text-align:center;color:var(--ink2)}
.nota{color:var(--ink2);font-size:.82rem;text-align:center;margin:4px 0 0}
</style></head>
<body>
<header class="top"><div class="in"><div class="marca">Kauri</div><div class="lugar">Departamento · Rincón de Guayabitos</div><h1>Llegadas y cobros</h1><p>Quién llega, cuánto cobrar y qué revisar.</p></div></header>
<main id="lista"><section class="card vacio">Cargando…</section></main>
<p class="nota">Esta página no aparece en Google. Los datos del huésped se cargan solo con tu liga personal.</p>
<script>
/* Panel del dueño (18 oct 2026). Los datos privados (nombre completo, teléfono) NO viven en esta página:
   se bajan de la hoja privada con la llave de la liga (#llave-…), que se guarda solo en este teléfono. */
var HOJA="https://script.google.com/macros/s/AKfycbxTFk2v70v0IKT_g--d6P7IJlJ6tMtP6rjd07C6QbyBVbkxsMWjpIuvyf9MpkBlwxUqhg/exec", SLUG="dueno-depa", DALI="523117408139", NS="kauri-dueno-";
var PUB=[{folio:"DEPTO-261019-HE",huesped:"Agustín H.",llega:"2026-10-19",sale:"2026-10-25",noches:6,personas:9,total:10500,anticipo:5000,saldo:5500,canal:"Reserva directa",aviso:"Esta reserva es de 9 huéspedes: excepción autorizada. Si llegan más de 9 o traen mascota, avisa a Dalí antes de entregar la llave.",maxP:9}];
(function(){var m=/^#llave-([A-Za-z0-9_-]{16,})$/.exec(location.hash||"");if(m){try{localStorage.setItem(NS+"llave",m[1])}catch(e){}history.replaceState(null,"",location.pathname)}})();
function g(k){try{return localStorage.getItem(NS+k)}catch(e){return null}}
function m(n){return "$"+Number(n).toLocaleString("es-MX")+" MXN"}
function fe(iso){var D=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"],M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],p=String(iso).split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return D[d.getDay()]+" "+(+p[2])+" "+M[+p[1]-1]}
function hoyIso(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tel(t){var d=String(t||"").replace(/\D/g,"");return d.length===10?"52"+d:d}
function pinta(L){
  var el=document.getElementById("lista");
  if(!L.length){el.innerHTML='<section class="card vacio">No hay llegadas próximas. 🌴</section>';return}
  el.innerHTML=L.map(function(r,i){
    var k=NS+r.folio+"-",ini=String(r.huesped).split(" ").map(function(x){return x.charAt(0)}).join("").slice(0,2).toUpperCase(),t=tel(r.telefono),hoy=hoyIso();
    var est=r.llega===hoy?'<span class="chip hoy">Llega hoy</span>':(r.llega>hoy?'<span class="chip">Próxima llegada</span>':'<span class="chip">Hospedado ahora</span>');
    var cobrado=g(r.folio+"-0")==="1";
    var items=["Recibí el saldo de "+m(r.saldo)+" (efectivo o transferencia confirmada por Dalí)","Son "+(r.maxP||6)+" personas o menos","No traen mascotas","El depa quedó limpio y en orden el día de salida"];
    var saludo=encodeURIComponent("¡Hola, "+String(r.huesped).split(" ")[0]+"! Te saludamos de Departamento Kauri. ");
    return '<section class="card" style="animation-delay:'+(i*80)+'ms">'+est+
     '<div class="huesped"><span class="av">'+ini+'</span><div><b>'+r.huesped+'</b><span>Folio '+r.folio+' · '+(r.canal||"Reserva directa")+'</span>'+(r.telefono?'<span style="display:block">📱 '+r.telefono+'</span>':'')+'</div></div>'+
     '<div class="acciones"><a class="btn wa" target="_blank" rel="noopener" href="'+(t?"https://wa.me/"+t+"?text="+saludo:"#")+'"'+(t?'':' aria-disabled="true"')+'>💬 Escribirle</a><a class="btn tel" href="'+(t?"tel:+"+t:"#")+'"'+(t?'':' aria-disabled="true"')+'>📞 Llamar</a></div>'+
     (t?'':'<p class="nota" style="margin:-6px 0 0">El teléfono aparece cuando Dalí lo agrega.</p>')+
     '<div class="fechas"><div><small>Llega</small><b>'+fe(r.llega)+'</b><br><small style="text-transform:none;letter-spacing:0">desde 3:00 p.m.</small></div><i>'+r.noches+' noches</i><div><small>Sale</small><b>'+fe(r.sale)+'</b><br><small style="text-transform:none;letter-spacing:0">antes de 12:00 p.m.</small></div></div>'+
     '<div class="cobro'+(cobrado?' listo':'')+'"><small>'+(cobrado?'✓ Saldo cobrado':'Cobrar en efectivo')+'</small><b>'+m(r.saldo)+'</b><p>'+(cobrado?'Ya quedó registrado en este teléfono.':'Solo si no lo transfirió antes. Dalí te avisa si ya pagó.')+'</p></div>'+
     '<dl><dt>Huéspedes</dt><dd>'+r.personas+'</dd><dt>Mascotas</dt><dd>No</dd><dt>Total</dt><dd>'+m(r.total)+'</dd><dt>Anticipo (lo tiene Dalí)</dt><dd>'+m(r.anticipo)+'</dd><dt>Saldo</dt><dd>'+m(r.saldo)+'</dd></dl>'+
     (r.aviso?'<div class="alerta">⚠️ '+r.aviso+'</div>':'')+
     '<ul class="check">'+items.map(function(x,j){return '<li><label><input type="checkbox" data-k="'+r.folio+'-'+j+'"'+(g(r.folio+"-"+j)==="1"?" checked":"")+'><span>'+x+'</span></label></li>'}).join("")+'</ul>'+
     '<a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/'+DALI+'?text='+encodeURIComponent("Dalí, ya cobré "+m(r.saldo)+" de la reserva "+r.folio+" ("+r.huesped+"). Llegaron ___ personas.")+'">✓ Avisar a Dalí que ya cobré</a></section>';
  }).join("");
}
document.addEventListener("change",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(!k)return;try{localStorage.setItem(NS+k,e.target.checked?"1":"0")}catch(x){}var c=e.target.closest(".card");if(c&&/-0$/.test(k)){var co=c.querySelector(".cobro");co.classList.toggle("listo",e.target.checked);co.querySelector("small").textContent=e.target.checked?"✓ Saldo cobrado":"Cobrar en efectivo"}});
var cache=null;try{cache=JSON.parse(g("cache")||"null")}catch(e){}
pinta(cache||PUB);
var llave=g("llave");
if(llave)fetch(HOJA+"?perfil="+SLUG+"&llave="+encodeURIComponent(llave)).then(function(r){return r.text()}).then(function(t){if(t.charAt(0)!=="{")return;var o=JSON.parse(t);if(o.reservas){try{localStorage.setItem(NS+"cache",JSON.stringify(o.reservas))}catch(e){}pinta(o.reservas)}}).catch(function(){});
</script>
</body></html>
