<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tu cotización · Kauri</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Cotización de hospedaje en Kauri Nayarit." />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary-color:#1F2F54;
    --highlight-color:#3B528A;
    --secondary-color:#DFE8EE;
    --ink:#2b3444;
    --muted:#6b7484;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#eef2f6; color:var(--ink);
    font:400 16px/1.7 'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--highlight-color);}

  .doc{max-width:660px; margin:0 auto; padding:26px 16px 70px;}

  /* ---------- Encabezado ---------- */
  /* Cabecera con la foto del alojamiento (sale de PROPS). El degradado
     encima es lo que mantiene legible el texto sea cual sea la imagen. */
  .head{
    position:relative; overflow:hidden; color:#fff;
    border-radius:10px 10px 0 0; background:var(--primary-color);
  }
  .head .ph{position:absolute; inset:0; background-size:cover; background-position:center;}
  .head .ph::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(105deg, rgba(20,32,64,.94) 0%, rgba(20,32,64,.80) 52%, rgba(20,32,64,.58) 100%);
  }
  .head .inner{
    position:relative; z-index:2; padding:26px 30px;
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  }
  .head .id{display:flex; align-items:center; gap:14px;}
  .head img{width:50px; height:auto; display:block; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .head .brand{font:400 25px/1.15 'EB Garamond', serif; letter-spacing:.1em;}
  .head .place{
    font:600 10.5px/1.4 'Source Sans 3'; letter-spacing:.2em; text-transform:uppercase;
    color:#c3d0e4; margin-top:5px;
  }
  .head .folio-chip{
    /* Fondo propio: el chip cae sobre la zona clara de la foto y sin esto no se lee */
    border:1px solid rgba(255,255,255,.28); border-radius:6px; padding:10px 15px; text-align:right;
    background:rgba(16,26,52,.72); backdrop-filter:blur(3px);
  }
  .head .folio-chip .k{
    font:600 9.5px/1 'Source Sans 3'; letter-spacing:.18em; text-transform:uppercase; color:#c3d0e4;
  }
  .head .folio-chip .v{font:700 15px/1.2 'Source Sans 3'; margin-top:5px; letter-spacing:.04em;}
  @media (max-width:520px){
    .head .inner{padding:22px 20px;}
    .head .brand{font-size:21px;}
    .head .folio-chip{text-align:left;}
  }

  .card{background:#fff; border-radius:0 0 10px 10px; box-shadow:0 10px 34px rgba(31,47,84,.10);}
  .pad{padding:0 30px;}
  @media (max-width:520px){ .head{padding:26px 20px;} .pad{padding:0 20px;} }

  .stamp{text-align:center; padding:30px 0 4px;}
  .stamp span{
    display:inline-block; background:var(--secondary-color); color:var(--primary-color);
    font:700 12px/1 'Source Sans 3'; letter-spacing:.14em; text-transform:uppercase;
    padding:11px 20px; border-radius:22px;
  }
  .greet{margin:20px 0 6px; font-size:17px;}
  .greet strong{color:var(--primary-color);}

  h3{
    font:700 10.5px/1 'Source Sans 3'; letter-spacing:.17em; text-transform:uppercase;
    color:var(--primary-color); margin:34px 0 0; padding-bottom:11px;
    border-bottom:1px solid var(--secondary-color);
  }

  /* ---------- Vigencia ---------- */
  .vigencia{
    border:1px solid var(--highlight-color); border-left-width:4px; border-radius:8px;
    padding:15px 18px; margin-top:22px; background:#F7FAFC;
  }
  .vigencia .t{font-weight:700; color:var(--primary-color);}
  .vigencia.vencida{border-color:#c2410c; background:#FEF6F1;}
  .vigencia.vencida .t{color:#9a3412;}

  /* ---------- Fechas ---------- */
  .dates{
    display:grid; grid-template-columns:1fr 1fr; margin-top:22px;
    border:1px solid var(--secondary-color); border-radius:8px; overflow:hidden;
  }
  .dates > div{padding:18px 20px;}
  .dates > div:first-child{border-right:1px solid var(--secondary-color);}
  @media (max-width:440px){
    .dates{grid-template-columns:1fr;}
    .dates > div:first-child{border-right:none; border-bottom:1px solid var(--secondary-color);}
  }
  .dates .lbl{font:700 11px/1 'Source Sans 3'; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .dates .val{font:700 19px/1.3 'Source Sans 3'; color:var(--primary-color); margin-top:7px;}
  .dates .hr{font-size:14px; color:var(--muted);}

  /* ---------- Tabla de importes ---------- */
  table.detail{width:100%; border-collapse:collapse; margin-top:6px;}
  table.detail td{padding:11px 0; border-bottom:1px solid #e6ecf2; font-size:15px;}
  table.detail td:first-child{color:var(--muted);}
  table.detail td:last-child{text-align:right; color:var(--primary-color); font-variant-numeric:tabular-nums; white-space:nowrap;}
  table.detail tr.tot td{font-weight:700; font-size:17px; border-bottom:2px solid var(--primary-color);}
  table.detail tr.tot td:first-child{color:var(--primary-color);}
  table.detail tr.dep td{color:var(--muted); font-size:14px;}

  .transferir{
    background:var(--primary-color); color:#fff; border-radius:8px;
    padding:16px 20px; margin-top:20px; display:flex; justify-content:space-between;
    align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  .transferir .l{font:600 12px/1.4 'Source Sans 3'; letter-spacing:.12em; text-transform:uppercase; color:#b9c6da;}
  .transferir .v{font:700 21px/1.2 'Source Sans 3'; font-variant-numeric:tabular-nums;}

  table.detail tr.lista td{color:#9aa3b2; font-size:14px;}
  table.detail tr.lista td:last-child{color:#9aa3b2; text-decoration:line-through;}
  .especial{background:#EAF5EE; border-radius:8px; padding:16px 20px; margin-top:20px;}
  .especial .k{font:700 12px/1 'Source Sans 3'; letter-spacing:.14em; text-transform:uppercase; color:#1a7f4b; margin-bottom:8px;}
  .especial .amt{font:700 19px/1.3 'Source Sans 3'; color:#1a7f4b;}
  .especial .amt small{font-weight:400; font-size:15px;}
  .especial .sub{margin-top:6px;}

  .apartar{border:1px solid var(--highlight-color); border-radius:8px; padding:18px 20px; margin-top:24px;}
  .apartar .amt{font:700 19px/1.3 'Source Sans 3'; color:var(--primary-color); margin-bottom:6px;}
  .note{background:#F4F7FA; border-left:3px solid var(--highlight-color); padding:15px 18px; margin-top:22px;}

  ul.incl{list-style:none; padding:0; margin:16px 0 0;}
  ul.incl li{padding:5px 0 5px 26px; position:relative;}
  ul.incl li::before{content:"\2713"; position:absolute; left:0; color:var(--highlight-color); font-weight:700;}

  /* ---------- Acciones ---------- */
  .cta{display:flex; gap:12px; flex-wrap:wrap; margin:32px 0 6px;}
  .cta a{
    flex:1; min-width:190px; text-align:center; text-decoration:none;
    padding:15px 20px; border-radius:5px;
    font:600 13px/1 'Source Sans 3'; letter-spacing:.08em; text-transform:uppercase;
    transition:background .25s ease, color .25s ease;
  }
  .cta .wa{background:#25D366; color:#fff;}
  .cta .wa:hover{background:#1da851;}
  .cta .gh{background:#fff; color:var(--primary-color); border:1px solid var(--primary-color); cursor:pointer;}
  .cta .gh:hover{background:var(--secondary-color);}

  footer{text-align:center; padding:30px 20px 34px; color:var(--muted); font-size:14px;}
  footer .folio{font-size:12px; margin-top:12px; letter-spacing:.06em;}
  .legal{font-size:12px; color:var(--muted); margin-top:18px; line-height:1.6;}

  /* ---------- Enlace inválido ---------- */
  .empty{background:#fff; border-radius:10px; padding:50px 30px; text-align:center; box-shadow:0 10px 34px rgba(31,47,84,.10);}
  .empty h2{font:400 25px/1.3 'EB Garamond', serif; color:var(--primary-color); margin:0 0 12px;}

  /* ---------- Impresión / PDF ---------- */
  @media print{
    /* Sin esto Safari y Chrome imprimen la cabecera en blanco */
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    body{background:#fff;}
    .cta, footer .noprint{display:none;}
    .card{box-shadow:none;}
    .doc{padding:0;}
  }
</style>
</head>
<body>

<div class="doc" id="doc"></div>

<script>
/* Datos fijos de cada alojamiento. Son DOS propiedades distintas, en dos pueblos
   distintos: nunca firmar el departamento como "Casa Kauri". */
const PROPS = {
  casa: {
    marca:'CASA KAURI', firma:'Casa Kauri',
    lugar:'La Peñita de Jaltemba · Nayarit',
    tel:'+52 56 2854 4253', wa:'525628544253',
    horaIn:'3:00 p.m.', horaOut:'11:00 a.m.',
    foto:'alberca.jpg',
    /* Respaldo por si la liga es vieja y no trae la lista en el payload. */
    incluye:['Casa completa para ti: 4 recámaras, 6 camas, 2.5 baños',
             'Alberca privada y jardín cercado en todo su perímetro',
             'Cocina equipada, wifi y aire acondicionado',
             'Estacionamiento dentro de la propiedad',
             'A 750 m caminando de la playa']
  },
  depto: {
    marca:'DEPARTAMENTO KAURI', firma:'Departamento Kauri',
    lugar:'Rincón de Guayabitos · Nayarit',
    tel:'+52 311 134 9845', wa:'523111349845',
    horaIn:'3:00 p.m.', horaOut:'12:00 p.m.',
    foto:'https://a0.muscache.com/im/pictures/hosting/Hosting-U3RheVN1cHBseUxpc3Rpbmc6MTI4MzQ5NTk2MjI1NzQ4NDA1Mw==/original/0f7d44be-e462-4fbe-bbcd-d4bbea2f5ce4.jpeg?im_w=1200',
    incluye:['Loft completo de 3 niveles solo para ti · hasta 6 huéspedes',
             'Nivel 1: sala con Smart TV, comedor, cocina equipada y balcón',
             'Nivel 2: área de descanso con 4 camas, aire acondicionado y baño completo',
             'Nivel 3: rooftop privado con regadera exterior',
             'A 100 m de la playa, sobre el andador principal']
  }
};

const mx = n => '$' + Number(n || 0).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' MXN';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fechaCorta(iso){
  if(!iso) return '—';
  // Mediodía UTC: evita que el huso horario del huésped recorra la fecha un día.
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'});
}
/* Vencida = estrictamente después del último día válido. La comparación se hace
   contra el día local del huésped, no contra la hora exacta: la cotización sigue
   viva todo el día de su vigencia. */
function vencida(iso){
  if(!iso) return false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const lim = new Date(iso + 'T12:00:00');
  if(isNaN(lim)) return false;
  lim.setHours(0,0,0,0);
  return hoy > lim;
}

/* Los datos viajan en el hash (#), no en la query (?), a propósito:
   el fragmento nunca se manda al servidor, así que los datos del cliente
   no quedan en los registros del hosting ni en referrers. */
function leerDatos(){
  const raw = location.hash.slice(1);
  if(!raw) return null;
  try{
    const b64 = raw.replace(/-/g,'+').replace(/_/g,'/');
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){
    return null;
  }
}

function vacio(){
  const p = PROPS.casa;
  return `
  <div class="empty">
    <h2>No pudimos leer esta cotización</h2>
    <p>Puede que la liga se haya cortado al copiarla o al enviarla por mensaje.
       Escríbenos y te la mandamos completa en un momento.</p>
    <div class="cta">
      <a class="wa" href="https://wa.me/${p.wa}?text=${encodeURIComponent('Hola, abrí la liga de mi cotización y no cargó. ¿Me la pueden reenviar?')}" target="_blank" rel="noopener">Escribir por WhatsApp</a>
      <a class="gh" href="index.html">Ir al inicio</a>
    </div>
  </div>`;
}

function cotizacion(d){
  // Los enlaces viejos no traen `prop`; se asume Casa Kauri para no romperlos.
  const p = PROPS[d.prop] || PROPS.casa;
  const tel = d.tel || p.tel;
  const wa  = d.wa  || p.wa;
  const n = d.n || 0;
  const total = d.total || 0;
  const deposito = d.deposito || 0;
  const anticipo = d.anticipo || 0;
  const saldo = d.saldo || 0;
  const esVencida = vencida(d.vigencia);

  const items = Array.isArray(d.items) ? d.items : [];
  /* El precio especial solo se pinta si el generador lo mandó, y solo si de verdad
     hay ahorro: un ancla igual o menor que el precio cobrado destruye la confianza. */
  const esp = (d.especial && d.especial.ahorro > 0) ? d.especial : null;
  const cuerpo =
      `<tr><td>Folio</td><td>${esc(d.folio)}</td></tr>`
    + `<tr><td>Huéspedes</td><td>${esc(d.huespedes)} persona${d.huespedes == 1 ? '' : 's'}</td></tr>`
    + (n ? `<tr><td>Noches</td><td>${n}</td></tr>` : '')
    + (esp ? `<tr class="lista"><td>Tarifa normal (${esp.n} × ${mx(esp.base)})</td><td>${mx(esp.hospedajeBase)}</td></tr>` : '')
    + items.map(it => `<tr><td>${esc(it[0])}</td><td>${mx(it[1])}</td></tr>`).join('')
    + `<tr class="tot"><td>Total de la estancia</td><td>${mx(total)}</td></tr>`
    + (deposito ? `<tr class="dep"><td>Depósito de garantía (reembolsable)</td><td>${mx(deposito)}</td></tr>` : '');

  const bloqueEspecial = esp ? `
    <div class="especial">
      <div class="k">Precio especial</div>
      <div class="amt">Ahorras ${mx(esp.ahorro)} <small>(${esp.pct} % menos)</small></div>
      <div class="sub">Tu tarifa queda en <strong>${mx(esp.tarifa)}</strong> por noche en lugar de
           ${mx(esp.base)}${esp.motivo ? ', ' + esc(esp.motivo) : ''}.</div>
    </div>` : '';

  const bloqueTransferir = deposito
    ? `<div class="transferir">
         <span class="l">Total a transferir</span>
         <span class="v">${mx(total + deposito)}</span>
       </div>
       <div class="legal">El depósito de garantía no es parte del precio: se devuelve íntegro
         dentro de las 72 horas siguientes a tu salida, una vez revisado el alojamiento.</div>`
    : '';

  const bloqueVigencia = d.vigencia
    ? (esVencida
        ? `<div class="vigencia vencida">
             <div class="t">Esta cotización venció el ${fechaCorta(d.vigencia)}</div>
             <div>Escríbenos y te la actualizamos con la disponibilidad y las tarifas de hoy.</div>
           </div>`
        : `<div class="vigencia">
             <div class="t">Válida hasta el ${fechaCorta(d.vigencia)}</div>
             <div>Las fechas no quedan apartadas hasta recibir el anticipo. Mientras tanto
                  siguen disponibles para cualquier otro huésped.</div>
           </div>`)
    : '';

  const bloqueApartar = anticipo
    ? `<div class="apartar">
         <div class="amt">Para apartar: ${mx(anticipo)}</div>
         <div>${saldo > 0
              ? 'El saldo de <strong>' + mx(saldo) + '</strong>'
                + (d.fechaSaldo ? ' se cubre a más tardar el <strong>' + fechaCorta(d.fechaSaldo) + '</strong>. ' : ' se cubre antes de tu llegada. ')
              : ''}${esc(d.datosPago)}</div>
       </div>`
    : (d.datosPago ? `<div class="apartar"><div class="amt">Cómo apartar tu fecha</div><div>${esc(d.datosPago)}</div></div>` : '');

  const bloqueNotas = d.notas
    ? `<div class="note"><strong>Nota sobre esta cotización:</strong><br />${esc(d.notas).replace(/\n/g,'<br />')}</div>`
    : '';

  const incluye = (d.incluye || '').split('\n').map(s => s.trim()).filter(Boolean);
  const bloqueIncluye = incluye.length
    ? `<h3>Lo que incluye</h3><ul class="incl">${incluye.map(l => '<li>' + esc(l) + '</li>').join('')}</ul>`
    : '';

  const msgWA = encodeURIComponent(
    'Hola, soy ' + (d.nombre || '') + '. Quiero apartar la cotización ' + (d.folio || '') +
    ' (' + fechaCorta(d.checkin) + ' al ' + fechaCorta(d.checkout) + ').'
  );

  return `
  <div class="head">
    <div class="ph" style="background-image:url('${esc(p.foto)}')"></div>
    <div class="inner">
      <div class="id">
        <img src="logo-kauri.png" alt="${esc(p.firma)}" />
        <div>
          <div class="brand">${esc(p.marca)}</div>
          <div class="place">${esc(p.lugar)}</div>
        </div>
      </div>
      ${d.folio ? '<div class="folio-chip"><div class="k">Cotización</div><div class="v">' + esc(d.folio) + '</div></div>' : ''}
    </div>
  </div>

  <div class="card">
    <div class="stamp"><span>Cotización${esVencida ? ' vencida' : ''}</span></div>

    <div class="pad">
      <p class="greet">Hola <strong>${esc(d.nombre)}</strong>, aquí está tu cotización
         para ${esc(p.firma)}. Cualquier ajuste, dínoslo y la rehacemos.</p>

      ${bloqueVigencia}

      <div class="dates">
        <div>
          <div class="lbl">Llegada</div>
          <div class="val">${fechaCorta(d.checkin)}</div>
          <div class="hr">a partir de las ${esc(d.horaIn || p.horaIn)}</div>
        </div>
        <div>
          <div class="lbl">Salida</div>
          <div class="val">${fechaCorta(d.checkout)}</div>
          <div class="hr">antes de las ${esc(d.horaOut || p.horaOut)}</div>
        </div>
      </div>

      <h3>Desglose</h3>
      <table class="detail">${cuerpo}</table>
      ${bloqueEspecial}
      ${bloqueTransferir}
      ${bloqueApartar}
      ${bloqueNotas}

      ${bloqueIncluye}

      ${d.politica ? '<h3>Si algo cambia</h3><p>' + esc(d.politica).replace(/\n/g,'<br />') + '</p>' : ''}

      <div class="cta">
        <a class="wa" href="https://wa.me/${wa}?text=${msgWA}" target="_blank" rel="noopener">${esVencida ? 'Pedir cotización nueva' : 'Quiero apartar mi fecha'}</a>
        <a class="gh" href="#" onclick="window.print();return false;">Guardar como PDF</a>
      </div>
    </div>

    <footer>
      <div class="noprint">¿Alguna duda? Escríbenos al WhatsApp <strong>${esc(tel)}</strong></div>
      <div class="folio">Folio ${esc(d.folio)} · ${esc(p.firma)}, ${esc(p.lugar.replace(' · ', ', '))}</div>
      <div class="folio">Esta cotización es informativa y no constituye una reserva.</div>
    </footer>
  </div>`;
}

function pintar(){
  const d = leerDatos();
  document.getElementById('doc').innerHTML = d ? cotizacion(d) : vacio();
  if(d && d.folio){
    const p = PROPS[d.prop] || PROPS.casa;
    document.title = 'Cotización ' + d.folio + ' · ' + p.firma;
  }
}

window.addEventListener('hashchange', pintar);
pintar();
</script>
</body>
</html>
