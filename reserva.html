<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tu reserva · Kauri</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Comprobante de reserva de Kauri Nayarit." />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary-color:#1F2F54;
    --highlight-color:#3B528A;
    --secondary-color:#DFE8EE;
    --ink:#2b3444;
    --muted:#6b7484;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#eef2f6; color:var(--ink);
    font:400 16px/1.7 'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--highlight-color);}

  .doc{max-width:660px; margin:0 auto; padding:26px 16px 70px;}

  /* ---------- Encabezado con foto del alojamiento ----------
     La foto sale de PROPS: cada alojamiento trae la suya. El degradado sobre
     ella es lo que mantiene el texto legible sea cual sea la imagen. */
  .head{
    position:relative; overflow:hidden; color:#fff;
    border-radius:10px 10px 0 0; background:var(--primary-color);
  }
  .head .ph{position:absolute; inset:0; background-size:cover; background-position:center;}
  .head .ph::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, rgba(20,32,64,.95) 0%, rgba(20,32,64,.84) 38%, rgba(20,32,64,.46) 78%, rgba(20,32,64,.30) 100%);
  }
  .head .inner{
    position:relative; z-index:2; padding:34px 30px;
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  }
  .head .id{display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none;}
  .head img{width:50px; height:auto; display:block; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .head .brand{font:400 25px/1.15 'EB Garamond', serif; letter-spacing:.1em;}
  .head .place{
    font:600 10.5px/1.4 'Source Sans 3'; letter-spacing:.2em; text-transform:uppercase;
    color:#c3d0e4; margin-top:5px;
  }
  .head .folio-chip{
    /* Fondo propio: el chip cae sobre la zona clara de la foto y sin esto no se lee */
    border:1px solid rgba(255,255,255,.28); border-radius:6px; padding:10px 15px; text-align:right;
    background:rgba(16,26,52,.72); backdrop-filter:blur(3px);
  }
  .head .folio-chip .k{
    font:600 9.5px/1 'Source Sans 3'; letter-spacing:.18em; text-transform:uppercase; color:#aebcd4;
  }
  .head .folio-chip .v{font:700 15px/1.2 'Source Sans 3'; margin-top:5px; letter-spacing:.04em;}
  @media (max-width:520px){
    .head .inner{padding:22px 20px; gap:14px;}
    .head .brand{font-size:19px; letter-spacing:.06em;}
    .head .place{letter-spacing:.13em; font-size:9.5px;}
    .head img{width:42px;}
    .head .folio-chip{text-align:left; padding:8px 13px;}
    .head .folio-chip .v{font-size:14px;}
  }

  /* ---------- Franja de estado ---------- */
  .status{
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    padding:18px 24px; background:#F4F8FB; border-bottom:1px solid var(--secondary-color);
  }
  .status .badge{
    background:#EAF5EE; color:#1a7f4b;
    font:700 11.5px/1 'Source Sans 3'; letter-spacing:.14em; text-transform:uppercase;
    padding:10px 18px; border-radius:22px; white-space:nowrap;
  }
  .status .count{font:600 14px/1.4 'Source Sans 3'; color:var(--primary-color);}
  .status .count small{display:block; font-weight:400; font-size:12.5px; color:var(--muted); letter-spacing:0;}

  .card{background:#fff; border-radius:0 0 10px 10px; box-shadow:0 10px 34px rgba(31,47,84,.10);}
  .pad{padding:0 30px;}
  @media (max-width:520px){ .head{padding:26px 20px;} .pad{padding:0 20px;} }

  .stamp{text-align:center; padding:30px 0 4px;}
  .stamp span{
    display:inline-block; background:#EAF5EE; color:#1a7f4b;
    font:700 12px/1 'Source Sans 3'; letter-spacing:.14em; text-transform:uppercase;
    padding:11px 20px; border-radius:22px;
  }
  .greet{margin:20px 0 6px; font-size:17px;}
  .greet strong{color:var(--primary-color);}

  h3{
    font:700 10.5px/1 'Source Sans 3'; letter-spacing:.17em; text-transform:uppercase;
    color:var(--primary-color); margin:34px 0 0; padding-bottom:11px;
    border-bottom:1px solid var(--secondary-color);
  }

  /* ---------- Fechas ---------- */
  .dates{
    display:grid; grid-template-columns:1fr auto 1fr; margin-top:24px; align-items:stretch;
    border:1px solid var(--secondary-color); border-radius:8px 8px 0 0; overflow:hidden;
  }
  .dates > div{padding:18px 20px;}
  .dates .nights{
    background:var(--primary-color); color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:18px 22px; text-align:center;
  }
  .dates .nights b{font:700 22px/1 'Source Sans 3';}
  .dates .nights span{
    font:600 9.5px/1.3 'Source Sans 3'; letter-spacing:.16em; text-transform:uppercase;
    color:#c3d0e4; margin-top:6px;
  }
  .dates .sub{font:400 13.5px/1.4 'Source Sans 3'; color:var(--muted); margin-top:2px;}
  .dates .out{text-align:right;}
  @media (max-width:440px){
    /* Apilar los tres bloques hacía una torre de seis renglones. En celular:
       las noches como banda arriba y llegada/salida lado a lado, que es como
       se lee un boleto. */
    .dates{grid-template-columns:1fr 1fr;}
    .dates .nights{
      grid-column:1 / -1; order:-1; flex-direction:row; gap:9px; padding:11px;
      border-bottom:1px solid var(--secondary-color);
    }
    .dates .nights span{margin-top:0;}
    .dates > div{padding:15px 16px;}
    .dates .out{text-align:right; border-left:1px solid var(--secondary-color);}
    .dates .val{font-size:17px;}
    .dates .sub, .dates .hr{font-size:12.5px;}
  }
  @media (max-width:400px){
    .meta > div{padding:11px 10px;}
    .meta .k{letter-spacing:.1em; font-size:9px;}
    .meta .v{font-size:12px;}
    /* En columna angosta "5 personas" se partía en dos: la etiqueta ya dice Huéspedes */
    .meta .u{display:none;}
  }
  .dates .lbl{font:700 11px/1 'Source Sans 3'; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .dates .val{font:700 19px/1.3 'Source Sans 3'; color:var(--primary-color); margin-top:7px;}
  .dates .hr{font-size:14px; color:var(--muted);}

  /* Fila de datos del documento: lo que en una factura va en la cabecera */
  .meta{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:2px;
    margin-top:2px; border:1px solid var(--secondary-color); border-top:0;
    border-radius:0 0 8px 8px; overflow:hidden; background:var(--secondary-color);
  }
  .meta > div{background:#fff; padding:13px 20px;}
  .meta .k{
    display:block; font:700 9.5px/1 'Source Sans 3'; letter-spacing:.15em;
    text-transform:uppercase; color:var(--muted);
  }
  .meta .v{display:block; font:600 14px/1.4 'Source Sans 3'; color:var(--primary-color); margin-top:5px;}
  @media (max-width:340px){ .meta{grid-template-columns:1fr;} }

  /* ---------- Tabla de importes ---------- */
  table.detail{width:100%; border-collapse:collapse; margin-top:6px;}
  table.detail td{padding:11px 0; border-bottom:1px solid #e6ecf2; font-size:15px;}
  table.detail td:first-child{color:var(--muted);}
  table.detail td:last-child{text-align:right; color:var(--primary-color); font-variant-numeric:tabular-nums;}
  table.detail tr.tot td{font-weight:700; font-size:17px; border-bottom:2px solid var(--primary-color);}
  /* Tarifa de lista tachada + bloque de ahorro: idénticos a los de cotizacion.html
     porque el huésped ve los dos documentos y cualquier diferencia se lee como error. */
  table.detail tr.lista td{color:#9aa3b2; font-size:14px;}
  table.detail tr.lista td:last-child{color:#9aa3b2; text-decoration:line-through;}
  .especial{background:#EAF5EE; border-radius:8px; padding:16px 20px; margin-top:20px;}
  .especial .k{font:700 12px/1 'Source Sans 3'; letter-spacing:.14em; text-transform:uppercase; color:#1a7f4b; margin-bottom:8px;}
  .especial .amt{font:700 19px/1.3 'Source Sans 3'; color:#1a7f4b;}
  .especial .amt small{font-weight:400; font-size:15px;}
  .especial .sub{margin-top:6px;}

  .balance{
    border:1px solid var(--highlight-color); border-left:4px solid var(--highlight-color);
    border-radius:8px; padding:20px 22px; margin-top:24px; background:#FAFCFE;
  }
  .balance .k{
    font:700 10px/1 'Source Sans 3'; letter-spacing:.16em; text-transform:uppercase;
    color:var(--highlight-color); display:block; margin-bottom:9px;
  }
  .balance .amt{font:700 27px/1.15 'Source Sans 3'; color:var(--primary-color); margin-bottom:9px; letter-spacing:-.01em;}
  .paid{background:#EAF5EE; color:#1a7f4b; border-radius:8px; padding:16px 20px; margin-top:24px; font-weight:700;}
  .note{background:#F4F7FA; border-left:3px solid var(--highlight-color); padding:15px 18px; margin-top:22px;}

  ul.incl{list-style:none; padding:0; margin:16px 0 0;}
  ul.incl li{padding:5px 0 5px 26px; position:relative;}
  ul.incl li::before{content:"✓"; position:absolute; left:0; color:var(--highlight-color); font-weight:700;}

  /* ---------- Acciones ---------- */
  .cta{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:34px 0 6px;}
  .cta a{
    text-align:center; text-decoration:none; padding:16px 18px; border-radius:6px;
    font:600 12.5px/1 'Source Sans 3'; letter-spacing:.09em; text-transform:uppercase;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
  }
  .cta a.wa{grid-column:1 / -1;}
  @media (max-width:440px){ .cta{grid-template-columns:1fr;} }
  .cta .wa{background:#25D366; color:#fff;}
  .cta .wa:hover{background:#1da851;}
  .cta .gh{background:#fff; color:var(--primary-color); border:1px solid var(--primary-color); cursor:pointer;}
  .cta .gh:hover{background:var(--secondary-color);}

  /* Volver al alojamiento: desde el comprobante se puede conocer la casa.
     Va como enlace y no como botón para no competir con el de WhatsApp. */
  .volver{
    display:block; text-align:center; margin:18px 0 2px; text-decoration:none;
    font:600 12.5px/1 'Source Sans 3'; letter-spacing:.06em; color:var(--highlight-color);
    padding:12px 10px; border-radius:6px; transition:background .2s ease;
  }
  .volver:hover{background:#F4F8FB;}

  footer{text-align:center; padding:30px 20px 34px; color:var(--muted); font-size:14px;}
  footer .folio{font-size:12px; margin-top:12px; letter-spacing:.06em;}

  /* ---------- Enlace inválido ---------- */
  .empty{background:#fff; border-radius:10px; padding:46px 30px 40px; text-align:center; box-shadow:0 10px 34px rgba(31,47,84,.10);}
  .empty .sello{width:56px; height:56px; margin:0 auto 18px; display:block; border-radius:12px;}
  .empty h2{font:400 27px/1.3 'EB Garamond', serif; color:var(--primary-color); margin:0 0 12px;}
  .empty p{max-width:420px; margin:0 auto;}
  .empty .cta{margin-top:26px;}
  .empty .cta a{grid-column:1 / -1;}
  .pegar{display:flex; gap:8px; max-width:430px; margin:22px auto 0;}
  .pegar input{
    flex:1; min-width:0; border:1px solid var(--secondary-color); border-radius:6px;
    padding:14px 15px; font:400 15px 'Source Sans 3', sans-serif; color:var(--ink); background:#fff;
  }
  .pegar input:focus{outline:none; border-color:var(--highlight-color);}
  .pegar button{
    border:none; border-radius:6px; background:var(--primary-color); color:#fff; cursor:pointer;
    padding:0 22px; font:600 12.5px/1 'Source Sans 3'; letter-spacing:.09em; text-transform:uppercase;
  }
  .pegar button:hover{background:var(--highlight-color);}
  .err{margin-top:14px; color:#9a3412; font-size:14px;}

  /* ---------- Impresión / PDF ---------- */
  /* Este bloque no se ve en pantalla: existe solo dentro del PDF. Un PDF que
     viaja por WhatsApp pierde el contexto de la página, así que tiene que
     llevar su propio camino de regreso a la versión viva. */
  /* La apariencia se define SIEMPRE; lo único que conmuta es el display. Así el
     bloque se ve igual venga de @media print o de la clase que pone beforeprint. */
  .solopdf{
    display:none; margin-top:26px; padding:16px 20px;
    border:1.5px solid var(--primary-color); border-radius:8px;
    page-break-inside:avoid;
  }
  .solopdf .k{
    font:700 11px/1 'Source Sans 3', sans-serif; letter-spacing:.14em;
    text-transform:uppercase; color:var(--primary-color); margin-bottom:8px;
  }
  .solopdf .liga{
    display:inline-block; font:700 16px/1.4 'Source Sans 3', sans-serif;
    color:var(--primary-color); text-decoration:underline; word-break:break-word;
  }
  .solopdf .sub{font-size:13px; line-height:1.6; color:#4b5563; margin-top:8px;}

  /* Dos caminos a propósito. `@media print` es lo estándar, pero si un navegador
     lo trata distinto el huésped se queda con un PDF sin camino de regreso —
     y ese PDF es justo lo que conserva. `beforeprint` es la red de abajo. */
  html.imprimiendo .solopdf{display:block;}
  html.imprimiendo .cta,
  html.imprimiendo .volver{display:none;}
  @media print{ .solopdf{display:block;} }
  @media print{
    /* Sin esto Safari y Chrome imprimen la cabecera en blanco */
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    body{background:#fff;}
    .cta, .volver, footer .noprint{display:none;}
    .card{box-shadow:none;}
    .doc{padding:0; max-width:none;}
    .head, .card{border-radius:0;}
    h3{page-break-after:avoid;}
    .dates, .balance, .paid, .note{page-break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="doc" id="doc"></div>

<script>
/* Datos fijos de cada alojamiento. Son DOS propiedades distintas, en dos pueblos
   distintos: nunca firmar el departamento como "Casa Kauri". */
const PROPS = {
  casa: {
    marca:'CASA KAURI', firma:'Casa Kauri',
    lugar:'La Peñita de Jaltemba · Nayarit',
    tel:'+52 56 2854 4253', wa:'525628544253',
    horaIn:'3:00 p.m.', horaOut:'11:00 a.m.',
    foto:'alberca.jpg', sitio:'index.html', sitioNombre:'Casa Kauri',
    /* Respaldo por si la liga es vieja y no trae la lista en el payload. */
    incluye:['Casa completa para ti: 4 recámaras, 6 camas, 2.5 baños',
             'Alberca privada y jardín cercado en todo su perímetro',
             'Cocina equipada, wifi y aire acondicionado',
             'Estacionamiento dentro de la propiedad',
             'A 750 m caminando de la playa'],
    llegada:'El acceso es autónomo, con candado de clave: puedes llegar a tu propio ritmo, '
          + 'sin esperar a nadie. **Un día antes te enviamos por WhatsApp la ubicación exacta, '
          + 'la clave y las indicaciones para llegar.**\n\n'
          + 'Ismael es nuestro anfitrión en La Peñita y está al pendiente durante toda tu '
          + 'estancia por cualquier cosa que necesites.'
  },
  depto: {
    marca:'DEPARTAMENTO KAURI', firma:'Departamento Kauri',
    lugar:'Rincón de Guayabitos · Nayarit',
    tel:'+52 311 134 9845', wa:'523111349845',
    horaIn:'3:00 p.m.', horaOut:'12:00 p.m.',
    foto:'https://a0.muscache.com/im/pictures/hosting/Hosting-U3RheVN1cHBseUxpc3Rpbmc6MTI4MzQ5NTk2MjI1NzQ4NDA1Mw==/original/0f7d44be-e462-4fbe-bbcd-d4bbea2f5ce4.jpeg?im_w=1200',
    sitio:'departamento.html', sitioNombre:'Departamento Kauri',
    incluye:['Loft completo de 3 niveles solo para ti · hasta 6 huéspedes',
             'Nivel 1: sala con Smart TV, comedor, cocina equipada y balcón',
             'Nivel 2: área de descanso con 4 camas, aire acondicionado y baño completo',
             'Nivel 3: rooftop privado con regadera exterior',
             'A 100 m de la playa, sobre el andador principal'],
    llegada:'Tu llegada es en **Andador Colorines 4A, Rincón de Guayabitos, Nayarit** '
          + '(https://maps.app.goo.gl/xwAyVKAvdusuxjtG9). El estacionamiento es público y '
          + 'gratuito alrededor del alojamiento.\n\n'
          + '**Un día antes te enviamos la Guía de Bienvenida**, con el croquis de cómo llegar, '
          + 'la contraseña del wifi y todo lo que necesitas saber del departamento. Si quieres '
          + 'flores, decoración o alguna sorpresa para una fecha especial, avísanos con al menos '
          + '72 horas de anticipación y lo preparamos con un costo adicional.'
  }
};

/* La política de cancelación es la misma en las dos propiedades y no cambia
   casi nunca: si el generador no manda una distinta, se usa esta. */
const POLITICA = 'Cancelación sin costo hasta 15 días antes de la llegada; el anticipo se '
  + 'reembolsa completo. Dentro de los 15 días previos, el anticipo se puede aplicar a otra '
  + 'fecha dentro de los siguientes 6 meses, sujeto a disponibilidad.';
const WA = PROPS.casa.wa;

/* Negritas ligeras (**así**) en los textos que el operador escribe a mano.
   Se escapa antes de convertir, para que el texto del panel no pueda inyectar HTML. */
function parrafos(txt){
  return String(txt || '').split(/\n{2,}/).filter(Boolean).map(t =>
    esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          // El paréntesis o el punto final NO forman parte de la liga: si se los traga,
          // el enlace se rompe y además se ve como un renglón de código.
          .replace(/(https?:\/\/[^\s<]*[^\s<.,;:)\]])/g, function(u){
            const mapa = /maps\.app\.goo\.gl|google\.[a-z.]+\/maps|maps\.google/.test(u);
            return '<a href="' + u + '" target="_blank" rel="noopener">' +
                   (mapa ? 'Ver ubicación en Google Maps' : 'Abrir enlace') + '</a>';
          })
          .replace(/\n/g, '<br />')
  );
}

const mx = n => '$' + Number(n || 0).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' MXN';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fechaCorta(iso){
  if(!iso) return '—';
  // Mediodía UTC: evita que el huso horario del huésped recorra la fecha un día.
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'});
}

/* Para la tira de llegada/salida: el día grande y el resto pequeño, con el día
   de la semana. "Viernes 18" pesa más en la cabeza del huésped que "18/09". */
function fechaViaje(iso){
  if(!iso) return {dia:'—', resto:''};
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return {dia:'—', resto:''};
  const sem = d.toLocaleDateString('es-MX', {weekday:'long'});
  return {
    dia: sem.charAt(0).toUpperCase() + sem.slice(1) + ' ' + d.getDate(),
    resto: d.toLocaleDateString('es-MX', {month:'long', year:'numeric'})
  };
}

/* Los datos viajan en el hash (#), no en la query (?), a propósito:
   el fragmento nunca se manda al servidor, así que los datos del huésped
   no quedan en los registros de Netlify ni en referrers. */
function decodificar(raw){
  if(!raw) return null;
  try{
    const b64 = raw.replace(/-/g,'+').replace(/_/g,'/');
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){
    return null;
  }
}

function leerDatos(){ return decodificar(location.hash.slice(1)); }

/* Cuando alguien llega a la página sin su liga (por ejemplo desde el menú del
   sitio) puede pegarla aquí. Se acepta la liga completa o solo la parte de
   después del #, que es lo que la gente alcanza a copiar de WhatsApp. */
function abrirDesdeLiga(){
  const campo = document.getElementById('liga');
  const err = document.getElementById('errliga');
  const texto = (campo && campo.value || '').trim();
  const corte = texto.indexOf('#');
  const raw = (corte >= 0 ? texto.slice(corte + 1) : texto).trim();
  if(raw && decodificar(raw)){
    location.hash = '#' + raw;
    pintar();
    window.scrollTo(0, 0);
  }else if(err){
    err.hidden = false;
  }
  return false;
}

function vacio(){
  return `
  <div class="empty">
    <img class="sello" src="favicon.png" alt="Kauri" />
    <h2>Abre tu comprobante</h2>
    <p>Tu comprobante se abre con el <strong>enlace personal</strong> que te enviamos por WhatsApp
       al confirmar tu reserva. Si lo tienes a la mano, pégalo aquí:</p>
    <form class="pegar" onsubmit="return abrirDesdeLiga();">
      <input id="liga" type="text" inputmode="url" autocomplete="off"
             placeholder="Pega aquí el enlace de tu reserva" aria-label="Enlace de tu reserva" />
      <button type="submit">Abrir</button>
    </form>
    <p class="err" id="errliga" hidden>Ese enlace se ve incompleto: al copiarlo suele cortarse.
       Cópialo otra vez completo, o pídenoslo por WhatsApp y te lo reenviamos.</p>
    <div class="cta">
      <a class="wa" href="https://wa.me/${WA}?text=${encodeURIComponent('Hola, quiero ver mi comprobante de reserva y no tengo el enlace. ¿Me lo pueden reenviar?')}" target="_blank" rel="noopener">Pedir mi enlace por WhatsApp</a>
      <a class="gh" href="index.html">Ir al inicio</a>
    </div>
  </div>`;
}

/* Dónde está el huésped en el tiempo respecto a su estancia. Se calcula al
   abrir la página, así que el mismo enlace dice cosas distintas antes, durante
   y después del viaje. Las fechas se leen a medianoche local para que la cuenta
   de días no se recorra por el huso horario. */
function estadoEstancia(d, p){
  if(!d.checkin) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const ini = new Date(d.checkin + 'T00:00:00');
  if(isNaN(ini)) return null;
  const fin = d.checkout ? new Date(d.checkout + 'T00:00:00') : null;
  const dias = Math.round((ini - hoy) / 86400000);
  const horaIn = esc(d.horaIn || p.horaIn);

  if(dias > 1)   return {t:'Faltan ' + dias + ' días para tu llegada', s:'Te esperamos el ' + fechaCorta(d.checkin)};
  if(dias === 1) return {t:'Tu llegada es mañana', s:'A partir de las ' + horaIn};
  if(dias === 0) return {t:'¡Hoy es el día!', s:'Te esperamos a partir de las ' + horaIn};
  if(fin && !isNaN(fin) && hoy < fin) return {t:'Estás en casa', s:'Tu salida es el ' + fechaCorta(d.checkout)};
  return {t:'Gracias por tu visita', s:'Esperamos recibirte de nuevo muy pronto'};
}

/* Archivo .ics para que el huésped guarde la estancia en su calendario.
   Evento de día completo: DTEND es exclusivo, así que la fecha de salida
   es justo la que va (no hay que restarle un día). En TEXT hay que escapar
   comas, puntos y coma y saltos de línea, o el archivo no se abre. */
function escIcs(t){
  return String(t == null ? '' : t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function textoIcs(d, p){
  const soloFecha = iso => String(iso || '').replace(/-/g,'');
  const sello = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Kauri Nayarit//Reserva//ES',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + escIcs('kauri-' + (d.folio || sello)) + '@casa-kauri.github.io',
    'DTSTAMP:' + sello,
    'DTSTART;VALUE=DATE:' + soloFecha(d.checkin),
    'DTEND;VALUE=DATE:' + soloFecha(d.checkout),
    'SUMMARY:' + escIcs('Estancia en ' + p.firma),
    'LOCATION:' + escIcs(p.lugar.replace(' · ', ', ')),
    'DESCRIPTION:' + escIcs('Folio ' + (d.folio || '') + ' · Llegada a partir de las ' +
      (d.horaIn || p.horaIn) + ' · Salida antes de las ' + (d.horaOut || p.horaOut)),
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
}
function guardarEnCalendario(){
  const d = leerDatos();
  if(!d || !d.checkin) return;
  const p = PROPS[d.prop] || PROPS.casa;
  const blob = new Blob([textoIcs(d, p)], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'reserva-' + (d.folio || 'kauri') + '.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function comprobante(d){
  // Los enlaces viejos no traen `prop`: se asume Casa Kauri para no romperlos.
  const p = PROPS[d.prop] || PROPS.casa;
  const wa = p.wa;
  const n = d.n || 0;
  const saldo = d.saldo || 0;

  // Solo importes: el folio va en la cabecera y los huéspedes y las noches en la
  // tira de arriba. Repetirlos aquí hacía que el documento pareciera un volcado.
  /* El precio especial solo se pinta si el generador lo mandó, y solo si de verdad
     hay ahorro: un ancla igual o menor que el precio cobrado destruye la confianza.
     Los enlaces de antes del 31 ago 2026 no traen `especial` y siguen funcionando. */
  const esp = (d.especial && d.especial.ahorro > 0) ? d.especial : null;

  const filas = [];
  if(d.tarifa)        filas.push(['Hospedaje' + (esp ? ' con tu precio especial' : '') + ' (' + n + ' × ' + mx(d.tarifa) + ')', mx(d.hospedaje)]);
  if(d.extras)        filas.push(['Limpieza y extras', mx(d.extras)]);
  if(d.totalMascotas) filas.push(['Mascotas (' + d.mascotas + ' × ' + mx(d.cargoMascota) + ')', mx(d.totalMascotas)]);

  const cuerpo =
      (esp ? `<tr class="lista"><td>Tarifa normal (${esp.n} × ${mx(esp.base)})</td><td>${mx(esp.hospedajeBase)}</td></tr>` : '')
    + filas.map(f => `<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join('')
    + (d.total ? `<tr class="tot"><td>Total</td><td>${mx(d.total)}</td></tr>` : '')
    + (d.anticipo ? `<tr><td>Anticipo recibido</td><td>− ${mx(d.anticipo)}</td></tr>` : '');

  const bloqueEspecial = esp ? `
    <div class="especial">
      <div class="k">Tu precio especial</div>
      <div class="amt">Ahorraste ${mx(esp.ahorro)} <small>(${esp.pct} % menos)</small></div>
      <div class="sub">Tu tarifa quedó en <strong>${mx(esp.tarifa)}</strong> por noche en lugar de
           ${mx(esp.base)}${esp.motivo ? ', ' + esc(esp.motivo) : ''}.</div>
    </div>` : '';

  const bloqueSaldo = saldo > 0
    ? `<div class="balance">
         <span class="k">Saldo pendiente</span>
         <div class="amt">${mx(saldo)}</div>
         <div>${d.fechaSaldo ? 'A liquidar a más tardar el <strong>' + fechaCorta(d.fechaSaldo) + '</strong>. ' : ''}${esc(d.datosPago)}</div>
       </div>`
    : `<div class="paid">Tu reserva está pagada por completo. No hay nada pendiente.</div>`;

  const bloqueNotas = d.notas
    ? `<div class="note"><strong>Nota sobre tu reserva:</strong><br />${esc(d.notas).replace(/\n/g,'<br />')}</div>`
    : '';

  const lineaMascotas = d.mascotas > 0
    ? (d.mascotas == 1 ? 'Tu mascota, ya cubierta' : 'Tus ' + d.mascotas + ' mascotas, ya cubiertas') + ' en el total de arriba'
    : 'Mascotas bienvenidas (aplica un cargo adicional)';

  // Los enlaces viejos traían la lista de la casa fija en esta página; los nuevos
  // la mandan en el payload, porque el departamento tiene otra.
  const incluye = (d.incluye || '').split('\n').map(x => x.trim()).filter(Boolean);
  const listaIncluye = (incluye.length ? incluye : p.incluye).concat([lineaMascotas]);

  const llegada = parrafos(d.llegada || p.llegada);

  const fIn = fechaViaje(d.checkin), fOut = fechaViaje(d.checkout);
  const emitido = new Date().toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'});
  const est = estadoEstancia(d, p);

  const msgWA = encodeURIComponent(
    'Hola, soy ' + (d.nombre || '') + '. Reserva ' + (d.folio || '') +
    ' (' + fechaCorta(d.checkin) + ' al ' + fechaCorta(d.checkout) + '). Ya revisé mi confirmación.'
  );

  return `
  <div class="head">
    <div class="ph" style="background-image:url('${esc(p.foto)}')"></div>
    <div class="inner">
      <a class="id" href="${p.sitio}" title="Ir a la página de ${esc(p.firma)}">
        <img src="logo-kauri.png" alt="${esc(p.firma)}" />
        <div>
          <div class="brand">${esc(p.marca)}</div>
          <div class="place">${esc(p.lugar)}</div>
        </div>
      </a>
      ${d.folio ? '<div class="folio-chip"><div class="k">Folio de reserva</div><div class="v">' + esc(d.folio) + '</div></div>' : ''}
    </div>
  </div>

  <div class="card">
    <div class="status">
      <span class="badge">✓ Reserva confirmada</span>
      ${est ? '<span class="count">' + est.t + '<small>' + est.s + '</small></span>' : ''}
    </div>

    <div class="pad">
      <p class="greet">Hola <strong>${esc(d.nombre)}</strong>, tu reserva está confirmada.
         Esta página es tu comprobante: guárdala, aquí tienes todo lo de tu estancia.</p>

      <div class="dates">
        <div>
          <div class="lbl">Llegada</div>
          <div class="val">${fIn.dia}</div>
          <div class="sub">${fIn.resto}</div>
          <div class="hr">Desde las ${esc(d.horaIn || p.horaIn)}</div>
        </div>
        <div class="nights"><b>${n}</b><span>${n == 1 ? 'noche' : 'noches'}</span></div>
        <div class="out">
          <div class="lbl">Salida</div>
          <div class="val">${fOut.dia}</div>
          <div class="sub">${fOut.resto}</div>
          <div class="hr">Hasta las ${esc(d.horaOut || p.horaOut)}</div>
        </div>
      </div>

      <div class="meta">
        <div><span class="k">Huéspedes</span><span class="v">${esc(d.huespedes)}<span class="u"> ${d.huespedes == 1 ? 'persona' : 'personas'}</span></span></div>
        <div><span class="k">Alojamiento</span><span class="v">${esc(p.firma)}</span></div>
        <div><span class="k">Emitido</span><span class="v">${emitido}</span></div>
      </div>

      <h3>Detalle de tu reserva</h3>
      <table class="detail">${cuerpo}</table>
      ${bloqueEspecial}
      ${bloqueSaldo}
      ${bloqueNotas}

      <h3>Lo que ya está incluido</h3>
      <ul class="incl">${listaIncluye.map(l => '<li>' + esc(l) + '</li>').join('')}</ul>

      <h3>Tu llegada</h3>
      ${llegada.map(t => '<p>' + t + '</p>').join('')}

      <h3>Si algo cambia</h3>
      <p>${esc(d.politica || POLITICA).replace(/\n/g,'<br />')}</p>

      <div class="cta">
        <a class="wa" href="https://wa.me/${wa}?text=${msgWA}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
        ${d.checkin ? '<a class="gh" href="#" onclick="guardarEnCalendario();return false;">Guardar en mi calendario</a>' : ''}
        <a class="gh" href="#" onclick="window.print();return false;">Descargar en PDF</a>
      </div>
      <a class="volver" href="${p.sitio}">← Volver a ${esc(p.sitioNombre)}</a>

      <div class="solopdf">
        <div class="k">Tu comprobante en línea</div>
        <a class="liga" href="${ligaViva()}">Abrir mi comprobante en línea</a>
        <div class="sub">
          Este PDF es una foto de tu reserva. La versión en línea siempre está al día:
          te dice cuántos días faltan para tu llegada y te deja guardar las fechas en tu calendario.
          <br />Si lo estás leyendo en tu teléfono, toca el renglón azul de arriba.
        </div>
      </div>
    </div>

    <footer>
      <div class="noprint">¿Alguna duda? Escríbenos al WhatsApp <strong>${esc(d.telCasa) || p.tel}</strong></div>
      <div class="folio">Folio ${esc(d.folio)} · ${esc(p.firma)}, ${esc(p.lugar.replace(' · ', ', '))}</div>
    </footer>
  </div>`;
}

/* La URL de esta misma página, sin el `?pdf=1` que dispara la impresión: si se
   colara en el enlace del PDF, abrirlo volvería a lanzar el diálogo de imprimir.
   El hash sí va — es donde viven los datos de la reserva. */
function ligaViva(){
  return location.href.split('#')[0].split('?')[0] + location.hash;
}

function pintar(){
  const d = leerDatos();
  document.getElementById('doc').innerHTML = d ? comprobante(d) : vacio();
  if(d && d.folio){
    const p = PROPS[d.prop] || PROPS.casa;
    document.title = 'Reserva ' + d.folio + ' · ' + p.firma;
  }
}

window.addEventListener('hashchange', pintar);
pintar();

/* El generador abre la página con ?pdf=1 para que el anfitrión llegue directo al
   diálogo de guardar en PDF, sin explicarle dónde está el botón. */
window.addEventListener('beforeprint', function(){
  document.documentElement.classList.add('imprimiendo');
});
window.addEventListener('afterprint', function(){
  document.documentElement.classList.remove('imprimiendo');
});

if(/[?&]pdf=1/.test(location.search)){
  setTimeout(function(){ window.print(); }, 700);
}
</script>
</body>
</html>
